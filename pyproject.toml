[project]
name = "jobservice"
version = "0.1.0"
description = "Job vacancy collector for Jobs.cz and StartupJobs.cz into SQLite"
requires-python = ">=3.12.10"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "selectolax>=1.0.2",
]

[project.scripts]
jobservice = "jobservice:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
